[project]
name = "demo-host"
version = "0.1.0"
description = "A stand-in EHR that embeds the e-signing service end to end"
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Deliberately tiny, and deliberately *not* the `esign` package: this app is a stand-in for a
# customer's EHR and may only reach the service the way a customer would -- over HTTP, with an
# API key, and with a webhook endpoint it verifies itself.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    # Addendum 2: a real EHR renders its own reports. This one does too, rather than shipping a
    # 30-page PDF as a fixture, because the point of a host document is that it is generated per
    # patient and is different every time.
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    # Tests only: reading back a generated report the way the service will read it (page count,
    # widget names, widget rects). Nothing in `src` parses a PDF -- the generator knows.
    "pypdf>=5.0",
    "types-reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_host"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "S", "TID", "PTH", "ARG", "DTZ"]
ignore = [
    "E501",  # line length is the formatter's job
    "B008",  # FastAPI puts Depends()/Form() in defaults
    "S101",  # assert is how tests are written
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "DTZ"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests"]
exclude = "(^|/)\\.venv/"

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
